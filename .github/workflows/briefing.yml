name: WSB Morning Briefing

on:
  schedule:
    # GitHub Actions cron drifts BADLY on top-of-hour times — round-hour
    # schedules can fire 6+ hours late under load. We use an odd minute and
    # schedule early to absorb drift:
    #   11:23 UTC nominal  =  4:23am PDT  /  3:23am PST  (Mon–Fri)
    # Even with 2–4 hours of drift, the briefing reliably lands before 8am PT.
    - cron: '23 11 * * 1-5'
  # Lets you trigger a run manually from the Actions tab whenever you want.
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python scraper.py
